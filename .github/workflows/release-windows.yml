name: release windows

on:
  push:
    tags:
      - 'release-*'
      - 'v*'

jobs:
  build-windows-release:
    runs-on: windows-latest
  
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Move to the parent directory and fetch dependencies
      - name: Fetch dependencies
        run: |
          cd ..
          mkdir lib
          cd lib
          git clone https://github.com/razterizer/Core.git
          git clone https://github.com/razterizer/Termin8or.git
          git clone https://github.com/razterizer/8Beat.git
          git clone https://github.com/razterizer/AudioLibSwitcher_applaudio.git --recurse-submodules
          git clone https://github.com/razterizer/applaudio.git
          git clone https://github.com/razterizer/TrainOfThought.git

      # Step 3: Build project
      - name: Run build.bat
        continue-on-error: false
        run: |
          cd $env:GITHUB_WORKSPACE\Asciiroid_Belt
          ./build.bat
          
      - name: Debug - List ALL files after build
        run: |
          cd $env:GITHUB_WORKSPACE
          echo "=== Full directory structure ==="
          Get-ChildItem -Recurse -File | Select-Object Name, Directory | Format-Table
          
      - name: Prepare files for upload
        run: |
          New-Item -ItemType Directory -Force -Path "upload-temp"
          Copy-Item "Asciiroid_Belt/x64/Release/Asciiroid_Belt.exe" "upload-temp/"
          Copy-Item "Asciiroid_Belt/x64/Release/music.ct" "upload-temp/"
          # Copy-Item "Asciiroid_Belt/x64/Release/asciiroid_belt.tx" "upload-temp/"
          Copy-Item "Asciiroid_Belt/x64/Release/title.txt" "upload-temp/"
          if (Test-Path "Asciiroid_Belt/x64/Release/fonts") {
              Copy-Item -Recurse "Asciiroid_Belt/x64/Release/fonts" "upload-temp/"
          }

      # Step 4: Upload build artifact
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: asciiroid_belt-windows-build
          path: upload-temp/
          retention-days: 1

  create-windows-release:
    runs-on: windows-latest
    needs: build-windows-release
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: asciiroid_belt-windows-build
          path: windows-build
          
      - name: Debug - List downloaded files
        run: |
          cd windows-build
          echo "=== Downloaded files ==="
          Get-ChildItem -Recurse
          
      - name: Create Windows distribution package
        run: |
          cd windows-build
          # Create a clean distribution folder
          New-Item -ItemType Directory -Force -Path "asciiroid_belt-${{ github.ref_name }}"
          # Copy the executable and necessary files
          Copy-Item "Asciiroid_Belt.exe" "asciiroid_belt-${{ github.ref_name }}/"
          Copy-Item "music.ct" "asciiroid_belt-${{ github.ref_name }}/"
          # Copy-Item "asciiroid_belt.tx" "asciiroid_belt-${{ github.ref_name }}/"
          Copy-Item "title.txt" "asciiroid_belt-${{ github.ref_name }}/"
          # Copy fonts directory (if it exists)
          if (Test-Path "fonts") {
            Copy-Item -Recurse "fonts" "asciiroid_belt-${{ github.ref_name }}/"
          }
          echo "Unblock instructions:" > asciiroid_belt-${{ github.ref_name }}/README.txt
          echo "=====================" >> asciiroid_belt-${{ github.ref_name }}/README.txt
          echo "To tell Windows that this executable is fine" >> asciiroid_belt-${{ github.ref_name }}/README.txt
          echo " you can unblock the executable by" >> asciiroid_belt-${{ github.ref_name }}/README.txt
          echo " rightclicking the exe, then:" >> asciiroid_belt-${{ github.ref_name }}/README.txt
          echo "   Properties -> Unblock (check this)." >> asciiroid_belt-${{ github.ref_name }}/README.txt
          # Create zip archive
          Compress-Archive -Path "asciiroid_belt-${{ github.ref_name }}" -DestinationPath "asciiroid_belt-${{ github.ref_name }}-windows.zip"
          
      - name: Extract tag annotation as release notes
        shell: bash
        run: |
          git fetch --tags --force
          TAG="${{ github.ref_name }}"
          git tag -l --format='%(contents)' "$TAG" > RELEASE_NOTES.txt
          echo "Release notes extracted from tag annotation:"
          cat RELEASE_NOTES.txt
          
      - name: Upload package to release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: windows-build/asciiroid_belt-${{ github.ref_name }}-windows.zip
          allowUpdates: true
          bodyFile: RELEASE_NOTES.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
