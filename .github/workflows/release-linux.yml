name: release linux

on:
  push:
    tags:
      - 'release-*'
      - 'v*'

jobs:
  build-linux-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch dependencies
        run: |
          cd ..
          mkdir lib
          cd lib
          git clone https://github.com/razterizer/Core.git
          git clone https://github.com/razterizer/Termin8or.git
          git clone https://github.com/razterizer/8Beat.git
          git clone https://github.com/razterizer/AudioLibSwitcher_applaudio.git --recurse-submodules
          git clone https://github.com/razterizer/applaudio.git
          git clone https://github.com/razterizer/TrainOfThought.git

      - name: Install ALSA development packages
        run: sudo apt install libasound2-dev pkg-config

      - name: Build project
        run: |
          cd Asciiroids
          ./build.sh
        continue-on-error: false

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: asciiroids-glibc2.38
          path: Asciiroids/bin/
          retention-days: 1

  build-legacy-linux-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch dependencies
        run: |
          cd ..
          mkdir lib
          cd lib
          git clone https://github.com/razterizer/Core.git
          git clone https://github.com/razterizer/Termin8or.git
          git clone https://github.com/razterizer/8Beat.git
          git clone https://github.com/razterizer/AudioLibSwitcher_applaudio.git --recurse-submodules
          git clone https://github.com/razterizer/applaudio.git
          git clone https://github.com/razterizer/TrainOfThought.git

      - name: Install ALSA development packages
        run: sudo apt install libasound2-dev pkg-config

      - name: Build project
        run: |
          cd Asciiroids
          ./build.sh
        continue-on-error: false

      - name: Upload Legacy Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: asciiroids-glibc2.35
          path: Asciiroids/bin/
          retention-days: 1

  create-linux-release:
    runs-on: ubuntu-latest
    needs: [build-linux-release, build-legacy-linux-release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GLIBC 2.38 build
        uses: actions/download-artifact@v4
        with:
          name: asciiroids-glibc2.38
          path: glibc2.38

      - name: Download GLIBC 2.35 build
        uses: actions/download-artifact@v4
        with:
          name: asciiroids-glibc2.35
          path: glibc2.35

      - name: Create combined Linux distribution package
        run: |
          mkdir asciiroids-${{ github.ref_name }}
          cp glibc2.38/asciiroids asciiroids-${{ github.ref_name }}/asciiroids-glibc2.38
          cp glibc2.35/asciiroids asciiroids-${{ github.ref_name }}/asciiroids-glibc2.35
          cp glibc2.38/music.ct asciiroids-${{ github.ref_name }}/
          if [ -d glibc2.38/fonts ]; then
            cp -r glibc2.38/fonts asciiroids-${{ github.ref_name }}/
          fi
          echo "This package contains two binaries:" > asciiroids-${{ github.ref_name }}/README.txt
          echo "- asciiroids-glibc2.38: for modern systems (Ubuntu 24.04+, Arch Linux)" >> asciiroids-${{ github.ref_name }}/README.txt
          echo "- asciiroids-glibc2.35: for legacy systems (WSL, Ubuntu 22.04)" >> asciiroids-${{ github.ref_name }}/README.txt
          echo "" >> asciiroids-${{ github.ref_name }}/README.txt
          echo "Run the binary that matches your system's glibc version." >> asciiroids-${{ github.ref_name }}/README.txt
          tar -czf asciiroids-${{ github.ref_name }}-linux.tar.gz asciiroids-${{ github.ref_name }}/

      - name: Upload Linux package to release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: asciiroids-${{ github.ref_name }}-linux.tar.gz
          allowUpdates: true
          body: ${{ github.event.release.body || github.event.head_commit.message }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
