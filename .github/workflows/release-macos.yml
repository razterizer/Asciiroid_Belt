name: release macos

on:
  push:
    tags:
      - 'release-*'
      - 'v*'

jobs:
  build-macos-release:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Fetch dependencies
        run: |
          cd ..
          mkdir lib
          cd lib
          git clone https://github.com/razterizer/Core.git
          git clone https://github.com/razterizer/Termin8or.git
          git clone https://github.com/razterizer/8Beat.git
          git clone https://github.com/razterizer/AudioLibSwitcher_applaudio.git --recurse-submodules
          git clone https://github.com/razterizer/applaudio.git

      - name: Install OpenAL
        if: false  # Set to true if you need OpenAL
        run: brew install openal-soft
      
      - name: Build project
        run: |
          cd Asciiroid_Belt
          ./build.sh
        continue-on-error: false

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: asciiroid_belt-macos-build
          path: Asciiroid_Belt/bin/
          retention-days: 1

  create-macos-release:
    runs-on: ubuntu-latest
    needs: build-macos-release
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Download macOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: asciiroid_belt-macos-build
          path: macos-build
          
      - name: Create macOS distribution package
        run: |
          cd macos-build
          # Create a clean distribution folder
          mkdir -p asciiroid_belt-${{ github.ref_name }}
          # Copy the executable and necessary files
          chmod ugo+x asciiroid_belt
          cp asciiroid_belt asciiroid_belt-${{ github.ref_name }}/
          # cp hiscores.txt asciiroid_belt-${{ github.ref_name }}/
          cp music.ct asciiroid_belt-${{ github.ref_name }}/
          # cp asciiroid_belt.tx asciiroid_belt-${{ github.ref_name }}/
          cp title.txt asciiroid_belt-${{ github.ref_name }}/
          # Copy fonts directory (if it exists)
          if [ -d fonts ]; then
            cp -r fonts asciiroid_belt-${{ github.ref_name }}/
          fi
          echo "Unblock instructions:" > asciiroid_belt-${{ github.ref_name }}/README.txt
          echo "=====================" >> asciiroid_belt-${{ github.ref_name }}/README.txt
          echo "To tell the gatekeeper that this executable is fine" >> asciiroid_belt-${{ github.ref_name }}/README.txt
          echo " you can unblock the executable with" >> asciiroid_belt-${{ github.ref_name }}/README.txt
          echo " the following command:" >> asciiroid_belt-${{ github.ref_name }}/README.txt
          echo "   xattr -dr com.apple.quarantine asciiroid_belt" >> asciiroid_belt-${{ github.ref_name }}/README.txt
          # Create zip archive
          zip -r asciiroid_belt-${{ github.ref_name }}-macos.zip asciiroid_belt-${{ github.ref_name }}/
          
      - name: Extract tag annotation as release notes
        id: notes
        run: |
          git fetch --tags --force
          TAG="${{ github.ref_name }}"
          git tag -l --format='%(contents)' "$TAG" > RELEASE_NOTES.txt
          echo "Release notes extracted from tag annotation:"
          cat RELEASE_NOTES.txt
          
      - name: Upload package to release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: macos-build/asciiroid_belt-${{ github.ref_name }}-macos.zip
          allowUpdates: true
          replacesArtifacts: false
          bodyFile: RELEASE_NOTES.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
